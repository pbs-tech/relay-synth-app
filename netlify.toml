[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin the toolchain so deploys don't drift with Netlify's default image.
  NODE_VERSION = "22"

  # @cypress/code-coverage pulls cypress in as a peer dependency, so `npm ci`
  # would otherwise download the ~300MB Cypress binary on every deploy. The
  # site build never runs Cypress, so skip it.
  CYPRESS_INSTALL_BINARY = "0"

# The SPA rewrite and the config.json cache header are in public/_redirects and
# public/_headers rather than here. Netlify and Cloudflare Pages both read those
# files from the published directory, so the rules do not have to be restated
# per host - and rules in this file would take precedence over them, which is
# exactly the divergence worth avoiding while the site has two possible homes.
# (static.json covers the same rewrite for the Heroku buildpack.)

# The build reads VUE_APP_AUTH0_* and VUE_APP_API_BASE_URL from the site's
# Netlify environment variables and writes them to dist/config.json, which the
# app fetches at boot. They are still set on the site, not here, where they
# would be per-branch and committed. See README > Configuration.
#
# Note that the catch-all rewrite does not shadow /config.json: Netlify serves a
# file that exists in preference to a non-forced redirect. If the file is ever
# missing the rewrite answers with index.html, which the loader treats as "no
# config" and falls back to the build-time values.
