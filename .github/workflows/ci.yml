# PR checks for the Vue app. There were none before, which meant a dependency
# bump could only be judged by reading it; this gives the auto-merge workflow
# something real to gate on.
name: CI

on: pull_request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Cypress 16 declares `node: ^22 || ^24 || >=26`, so 18 cannot install the
  # tree at all. 22 is the current LTS in that set. vue-cli-service 5 builds
  # with webpack 5, which no longer hashes module ids with md4, so the
  # --openssl-legacy-provider flag the Vue 2 toolchain needed is gone with it.
  NODE_VERSION: '22'

jobs:
  application:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Cypress' postinstall downloads its ~200MB browser binary, which this
      # job never uses - it lints, unit tests and builds, it does not run e2e.
      # Skipping the download keeps the install fast and takes a network round
      # trip to a third-party CDN out of the critical path of every PR.
      - name: Install dependencies
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      # vue-cli-service lint rewrites files in place unless told not to. In CI
      # the point is to report, so --no-fix keeps it from silently "passing" on
      # a working tree it just edited and threw away.
      - name: Lint
        run: npm run lint -- --no-fix

      - name: Test
        run: npm run test:unit

      - name: Build
        run: npm run build

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The auto-merge workflow is ~60 lines of bash that decide whether a
      # dependency bump merges without a human reading it. Nothing checked it:
      # a typo in the polling loop would only surface on a live Dependabot PR,
      # which is the worst place to find out. actionlint validates workflow
      # syntax, action references and ${{ }} contexts, and runs shellcheck over
      # every `run:` block, so that script is covered statically.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # actionlint silently skips its shell checks when shellcheck is absent,
      # which would leave this job passing while testing half of what it claims
      # to. shellcheck ships in the ubuntu-latest image; fail loudly if that
      # ever stops being true rather than quietly weakening the gate.
      - name: Check shellcheck is available
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck not found - actionlint would skip shell script checks"
            exit 1
          }
          shellcheck --version

      - name: Lint workflows
        run: ./actionlint -color
