# Netlify already builds master on push through its own git integration, so
# this workflow is not that path. It exists for the redeploys that have no
# commit behind them: a changed site environment variable (they are inlined at
# build time, so a rebuild is the only way to pick one up), a rebuild after the
# API's Terraform outputs move, or retrying a build that failed on Netlify's
# side.
#
# It pokes a build hook rather than building here, so what ships is byte-for-
# byte the deploy a push would have produced - same Netlify image, same
# NODE_VERSION pin from netlify.toml, same site environment variables.
# Building in Actions instead would mean mirroring every VUE_APP_* value into
# GitHub secrets and keeping the two sets in sync forever.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run (shown in Netlify's deploy list)
        required: false
        default: Manual deploy
        type: string

# A Netlify site builds one deploy at a time regardless; this stops two
# dispatches from racing to claim the same deploy while polling below.
concurrency:
  group: deploy-netlify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy master to Netlify
    runs-on: ubuntu-latest
    # Attach required reviewers to this GitHub Environment to gate production.
    # GitHub creates it on first run if it does not exist yet.
    environment: prod

    steps:
      # The dispatch dropdown offers every branch, but a build hook builds the
      # branch it is configured for - master. Dispatching from a feature branch
      # would therefore deploy master while the run claims to be that branch.
      # Refuse rather than ship something the operator did not choose.
      - name: Check ref
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/master" ]; then
            echo "::error::Deploy must be dispatched from master, got ${REF}"
            exit 1
          fi

      - name: Trigger Netlify build
        id: trigger
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_HOOK}" ]; then
            echo "::error::NETLIFY_BUILD_HOOK is not set. Netlify > Site configuration > Build & deploy > Build hooks, then add the URL as a repository secret."
            exit 1
          fi

          # Unique per run so the poll below identifies *this* deploy rather
          # than whichever one happens to be newest when it looks.
          title="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}: ${REASON}"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

          # trigger_title has to ride in the query string - a build hook's POST
          # body is handed to the build as INCOMING_HOOK_BODY instead.
          encoded=$(printf '%s' "${title}" | jq -sRr @uri)

          status=$(curl --silent --show-error --request POST \
            --output /dev/null --write-out '%{http_code}' \
            "${BUILD_HOOK}?trigger_title=${encoded}")

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Build hook returned HTTP ${status}"
            exit 1
          fi
          echo "Build hook accepted (HTTP ${status})"

      # Without an API token the hook is fire-and-forget: a green run would
      # only mean Netlify accepted the request, not that the site built. Set
      # NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to make this job track the
      # deploy to its end state and fail when the build fails.
      - name: Wait for the deploy
        id: wait
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_TITLE: ${{ steps.trigger.outputs.title }}
        run: |
          set -euo pipefail

          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID not set - triggered the build but cannot confirm it succeeded. Watch it in the Netlify dashboard."
            echo "tracked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tracked=true" >> "$GITHUB_OUTPUT"

          api="https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys"
          deploy_id=""

          # 15s x 80 = 20 minutes. The site builds in ~2, so this is headroom
          # for a queue backed up behind someone else's deploy, not a normal
          # wait.
          for _ in $(seq 1 80); do
            sleep 15

            if [ -z "${deploy_id}" ]; then
              # The hook returns nothing identifying, so match on the title it
              # was given. Netlify has usually registered the deploy within a
              # poll or two of accepting the hook.
              deploy_id=$(curl --silent --show-error --fail \
                --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
                "${api}?per_page=20" \
                | jq -r --arg t "${DEPLOY_TITLE}" \
                    'map(select(.title == $t)) | .[0].id // empty' || true)
              if [ -n "${deploy_id}" ]; then
                echo "Tracking deploy ${deploy_id}"
              fi
              continue
            fi

            body=$(curl --silent --show-error --fail \
              --header "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              "${api}/${deploy_id}" || true)
            if [ -z "${body}" ]; then
              continue
            fi

            state=$(printf '%s' "${body}" | jq -r '.state // empty')
            echo "state: ${state:-unknown}"

            case "${state}" in
              ready)
                url=$(printf '%s' "${body}" | jq -r '.deploy_ssl_url // .ssl_url // empty')
                {
                  echo "url=${url}"
                  echo "deploy_id=${deploy_id}"
                } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              error|rejected)
                printf '%s' "${body}" | jq -r '.error_message // "no error message"'
                echo "::error::Netlify deploy ${deploy_id} finished as ${state}"
                exit 1
                ;;
            esac
          done

          if [ -z "${deploy_id}" ]; then
            echo "::error::Netlify never registered a deploy titled '${DEPLOY_TITLE}'. Check the build hook points at this site."
          else
            echo "::error::Timed out waiting for deploy ${deploy_id}"
          fi
          exit 1

      - name: Summary
        if: always()
        env:
          TRACKED: ${{ steps.wait.outputs.tracked }}
          DEPLOY_URL: ${{ steps.wait.outputs.url }}
          DEPLOY_ID: ${{ steps.wait.outputs.deploy_id }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "### Netlify deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Reason: ${REASON}"
            if [ "${TRACKED}" = "true" ]; then
              echo "- Deploy: \`${DEPLOY_ID:-unknown}\`"
              if [ -n "${DEPLOY_URL}" ]; then
                echo "- URL: ${DEPLOY_URL}"
              fi
            else
              echo "- Build triggered, not tracked (no Netlify API credentials configured)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
